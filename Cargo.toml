[package]
name = "shared-video-transcriber"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "Rust video downloader, transcriber and Docker login collector"

[dependencies]
age = "0.11"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3"
dotenvy = "0.15"
flate2 = "1"
fs2 = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusty-s3 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tungstenite = "0.28"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }


[dev-dependencies]

[profile.release]
strip = true
