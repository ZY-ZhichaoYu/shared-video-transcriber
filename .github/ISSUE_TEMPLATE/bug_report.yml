name: 使用问题 / Bug
description: 启动、下载、转录或界面问题
body:
  - type: markdown
    attributes:
      value: "请勿上传 .env、API key、私人录屏或完整会议文字。可从设置里复制脱敏环境检查报告。"
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 操作步骤、期望结果、实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏环境检查报告
      render: json
  - type: textarea
    id: error
    attributes:
      label: 必要的报错片段
      description: 请先检查是否含账号、私人路径、来源链接或密钥
