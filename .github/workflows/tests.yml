name: Rust and Docker checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Export generated lock and formatting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-generated
          path: |
            Cargo.lock
            src/*.rs
            tests/*.rs
      - name: Require a Python-free source tree
        run: test -z "$(git ls-files '*.py' '*.pyc' 'requirements*.txt')"
  webhook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test worker/tests/*.test.js
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shared-video-transcriber:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check Rust CLI and real headed Chromium
        run: |
          docker run --rm shared-video-transcriber:ci --help
          docker compose run --rm --pull never login --help
          docker run --rm --cap-add=SYS_ADMIN --security-opt seccomp=unconfined shared-video-transcriber:ci browser-check
      - name: Transcribe real sample audio using the packaged whisper.cpp
        run: |
          mkdir -p /tmp/video-models /tmp/video-input
          chmod 777 /tmp/video-models
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav -o /tmp/video-input/jfk.wav
          docker run --rm -v /tmp/video-models:/models -e WHISPER_MODEL=/models/ggml-tiny.bin shared-video-transcriber:ci model tiny
          docker run --rm -v /tmp/video-models:/models -v /tmp/video-input:/input:ro -e WHISPER_MODEL=/models/ggml-tiny.bin shared-video-transcriber:ci transcribe --file --language en /input/jfk.wav | tee /tmp/transcript.txt
          grep -qi 'country' /tmp/transcript.txt
      - name: Package login image built by remote CI
        if: github.event_name == 'push'
        run: docker save shared-video-transcriber:ci | gzip > login-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docker-login-image
          path: login-image.tar.gz
          compression-level: 0
          retention-days: 7
  configuration:
    needs: docker
    if: github.event_name == 'push' && vars.DOUYIN_SETUP_CHECK == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load configured application and webhook secrets
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
          INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH }}
        run: |
          bash scripts/install-infisical.sh
          node scripts/ci-secrets.mjs
          INFISICAL_SECRET_PATH="$INFISICAL_SECRET_PATH/webhook" node scripts/ci-secrets.mjs
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: ${{ env.TAILSCALE_TAGS }}
          version: '1.104.7'
      - name: Check live exit node, Worker and Telegram identity
        run: node scripts/check-deployment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: docker-login-image
          path: /tmp/login-image
      - name: Restore the real encrypted profile on a new runner
        env:
          NETWORK_MODE: tailscale
        run: |
          docker load --input /tmp/login-image/login-image.tar.gz
          sudo tailscale set --exit-node="$TAILSCALE_EXIT_NODE" --exit-node-allow-lan-access=false
          docker run --rm --network host --cap-add=SYS_ADMIN --security-opt seccomp=unconfined \
            -v /var/run/tailscale:/var/run/tailscale:ro -v "$(command -v tailscale):/usr/local/bin/tailscale:ro" \
            -e R2_ENDPOINT -e R2_BUCKET -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY \
            -e PROFILE_ENCRYPTION_KEY -e R2_PROFILE_PREFIX -e NETWORK_MODE -e TAILSCALE_EXIT_NODE \
            shared-video-transcriber:ci session-check
      - name: Finish the profile check's exit node stage
        if: always()
        run: sudo tailscale set --exit-node= || true
