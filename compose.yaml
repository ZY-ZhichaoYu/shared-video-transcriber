services:
  login:
    build: .
    image: shared-video-transcriber:local
    command: login
    env_file: .env
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./.runtime/docker:/data
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    init: true
